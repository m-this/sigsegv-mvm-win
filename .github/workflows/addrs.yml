name: Address table

# windows.txt from the game build Steam serves now, by the same scripts that
# made the committed one, and how the two differ. Every entry is a fixed RVA
# keyed to a ServerVersion, so a Valve update turns them all off until this
# runs. table.json names the build and depot 232255 manifest the committed
# table was made for. When Steam serves another build, a scheduled or
# dispatched run carries the overrides from that one, derives the table and
# commits it to winport-auto-<build> for the bed to play; merging it is a
# person's call.
#
# GitHub runs a cron only from the repository's default branch, and only from
# the copy of this file on it. While the default branch is one this file is
# not on, nothing watches for an update and the next one is found by a player.

on:
  schedule:
    # An update breaks every address until this runs, so look often.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      previous:
        description: the build overrides.json holds for, as BUILD:MANIFEST of depot 232255 (Windows binaries), to carry it to the build served now; empty takes it from tools/winport/table.json
        default: ''
      commit:
        description: commit the carried overrides and the derived table to this branch
        type: boolean
        default: false
  push:
    branches:
      - 'sigmod-windows-bed'
      # One branch per investigation, so two can ask the job questions at
      # once without writing over each other's disasm.txt and inspect.sh.
      - 'winport-*'
    paths:
      - '.github/workflows/addrs.yml'
      - 'tools/winport/*.py'
      - 'tools/winport/overrides.json'
      - 'tools/winport/table.json'
      - 'gamedata/sigsegv/windows.txt'
      - 'tools/winport/wanted.txt'
      - 'tools/winport/wantedengine.txt'
      - 'tools/winport/pluginsigs.txt'
      - 'tools/winport/bed/disasm.*'
      - 'tools/winport/bed/inspect.sh'

permissions:
  contents: write
  # To dispatch the bed on a carried table: a push made with this job's
  # token starts no workflow.
  actions: write

concurrency:
  group: addrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addrs:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # No game, no network: what a push can get wrong in the committed table
    # (its build, a name twice) fails here before the downloads below.
    - name: The committed table
      run: python3 tools/winport/checktable.py
    - name: Tools
      run: |
        pip install --quiet capstone pefile pyelftools
        sudo apt-get install -y -q binutils > /dev/null
        curl -sSfL --retry 3 -o dd.zip https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-linux-x64.zip
        unzip -q dd.zip -d dd && chmod +x dd/DepotDownloader
    - name: The two server binaries of the current build
      run: |
        printf 'regex:^tf/bin/server(_srv)?\\.(so|dll)$\nbin/engine.dll\nbin/engine_srv.so\nbin/dedicated.dll\nbin/SoundEmitterSystem.dll\nbin/soundemittersystem_srv.so\ntf/steam.inf\n' > files.txt
        for os in linux windows; do
          for attempt in 1 2 3; do
            ./dd/DepotDownloader -app 232250 -os $os -filelist files.txt -dir game-$os 2>&1 | tee -a dd-$os.log
            [ "${PIPESTATUS[0]}" = 0 ] && break
            sleep 15
          done
        done
        ls -la game-*/tf/bin game-*/tf/steam.inf
        grep -h -i 'ServerVersion' game-*/tf/steam.inf
    # The manifest is what a later run needs to fetch these binaries again,
    # and DepotDownloader prints it nowhere but here.
    - name: What the table is for, and what to carry from
      id: state
      run: |
        ver=$(grep -i '^ServerVersion=' game-windows/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        manifest=$(grep -o 'depot 232255 from app 232250, manifest [0-9]*' dd-windows.log | tail -n 1 | awk '{print $NF}')
        table_build=$(python3 -c "import json; print(json.load(open('tools/winport/table.json'))['build'])")
        table_manifest=$(python3 -c "import json; print(json.load(open('tools/winport/table.json'))['manifest'])")
        echo "served: ServerVersion $ver, depot 232255 manifest ${manifest:-unknown}; table.json: $table_build:$table_manifest"
        previous=$PREVIOUS target=
        if [ "$ver" != "$table_build" ] && [ -z "$previous" ]; then
          previous=$table_build:$table_manifest
        fi
        if [ "$COMMIT" = true ]; then
          target=$GITHUB_REF_NAME
        elif [ "$ver" != "$table_build" ]; then
          # A push only reports. The schedule runs on the default branch,
          # which keeps the old table until the branch is merged, so once
          # the branch exists every later run leaves it alone.
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            if git ls-remote --exit-code origin "refs/heads/winport-auto-$ver" > /dev/null; then
              echo "winport-auto-$ver already holds this build; not committing again"
            else
              target=winport-auto-$ver
            fi
          fi
        fi
        echo "previous: ${previous:-none}, commit to: ${target:-nowhere}"
        { echo "ver=$ver"; echo "manifest=$manifest"; echo "previous=$previous"; echo "previous_manifest=${previous#*:}"; echo "target=$target"; } >> "$GITHUB_OUTPUT"
      env:
        PREVIOUS: ${{ inputs.previous }}
        COMMIT: ${{ inputs.commit }}
    # Steam stops serving a past manifest to an anonymous account once the next
    # one is out: the 11087207 carry was refused 11076587's with a 401. So every
    # run keeps the Windows binaries it downloaded, keyed by their manifest, and
    # the next update's carry reads them back. The restore is what keeps the
    # entry from being evicted after a week unread.
    - name: The served build's Windows binaries, kept by an earlier run
      id: kept
      if: steps.state.outputs.manifest != ''
      uses: actions/cache/restore@v4
      with:
        path: winbins
        key: winbins-${{ steps.state.outputs.manifest }}
    - name: Keep the served build's Windows binaries
      if: steps.state.outputs.manifest != '' && steps.kept.outputs.cache-hit != 'true'
      run: |
        mkdir -p winbins/tf/bin winbins/bin
        cp game-windows/tf/bin/server.dll winbins/tf/bin/
        cp game-windows/bin/engine.dll game-windows/bin/dedicated.dll game-windows/bin/SoundEmitterSystem.dll winbins/bin/
    - if: steps.state.outputs.manifest != '' && steps.kept.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: winbins
        key: winbins-${{ steps.state.outputs.manifest }}
    - name: The previous build's Windows binaries, kept by an earlier run
      id: prevbins
      if: steps.state.outputs.previous != '' && steps.state.outputs.previous_manifest != steps.state.outputs.manifest
      uses: actions/cache/restore@v4
      with:
        path: winbins
        key: winbins-${{ steps.state.outputs.previous_manifest }}
    - name: Carry the overrides from the previous build
      if: steps.state.outputs.previous != ''
      run: |
        old_build=${PREVIOUS%%:*}
        manifest=${PREVIOUS#*:}
        prev=game-prev
        # An update can leave the Windows depot alone (11068238 to 11076587
        # did): the binaries are the ones just downloaded.
        if [ "$manifest" = "$SERVED_MANIFEST" ]; then
          prev=game-windows
        elif [ "$PREV_KEPT" = true ]; then
          prev=winbins
        else
          # Steam still serves a manifest for a while after an update, and a
          # build no run of this job has seen has nothing kept.
          printf 'tf/bin/server.dll\nbin/engine.dll\nbin/dedicated.dll\nbin/SoundEmitterSystem.dll\n' > prev.txt
          for attempt in 1 2 3; do
            ./dd/DepotDownloader -app 232250 -depot 232255 -manifest "$manifest" -filelist prev.txt -dir game-prev && break
            sleep 15
          done
        fi
        python3 tools/winport/carry.py $prev game-windows "$old_build" "$VER"
        git diff --stat tools/winport/overrides.json
        mkdir -p derived && cp tools/winport/overrides.json derived/overrides.json
      env:
        PREVIOUS: ${{ steps.state.outputs.previous }}
        SERVED_MANIFEST: ${{ steps.state.outputs.manifest }}
        PREV_KEPT: ${{ steps.prevbins.outputs.cache-hit }}
        VER: ${{ steps.state.outputs.ver }}
    - name: Derive the table
      run: |
        ver=$(grep -i '^ServerVersion=' game-windows/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        linux_ver=$(grep -i '^ServerVersion=' game-linux/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        [ "$ver" = "$linux_ver" ] || { echo "the two builds differ: $ver vs $linux_ver"; exit 1; }
        mkdir -p derived /tmp/sigport && cd derived
        python3 ../tools/winport/classify.py .. > classify.log && cp /tmp/sigport/classified.json .
        python3 ../tools/winport/dumplinuxvtables.py ../game-linux/tf/bin/server_srv.so linux-vtables > dumplinux.log
        python3 ../tools/winport/dumpvtables.py ../game-windows/tf/bin/server.dll win-vtables > dumpwin.log
        python3 ../tools/winport/matchvtables.py linux-vtables win-vtables classified.json > matchvtables.log
        python3 ../tools/winport/matchfuncs.py ../game-linux/tf/bin/server_srv.so ../game-windows/tf/bin/server.dll matches.json linux-vtables win-vtables > matchfuncs.log
        python3 ../tools/winport/argsize.py ../game-windows/tf/bin/server.dll matches.json > argsize.log
        python3 ../tools/winport/datamaps.py ../game-windows/tf/bin/server.dll ../gamedata/sigsegv/datamaps.txt > datamaps.json
        python3 ../tools/winport/emitgamedata.py matches.json "$ver" datamaps.json ../tools/winport/knownvtidx.generated.txt win-vtables > windows.txt
    - name: One block per name in the derived table
      run: python3 tools/winport/dupes.py . --table derived/windows.txt
    - name: How it differs from the committed table
      if: always()
      run: |
        cd derived
        ver=$(grep -i '^ServerVersion=' ../game-windows/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        echo "build served now: ServerVersion $ver"
        echo "committed table:  $(grep -m1 -o 'ServerVersion [0-9]*' ../gamedata/sigsegv/windows.txt)"
        addrs() { awk '/^\t+"[^"]+"\r?$/ { name = $0 } /^\t+addr +"/ { print name "\t" $2 }' "$1" | sort; }
        addrs ../gamedata/sigsegv/windows.txt > committed.tsv
        addrs windows.txt > derived.tsv
        echo "entries: committed $(wc -l < committed.tsv), derived $(wc -l < derived.tsv), same address $(comm -12 committed.tsv derived.tsv | wc -l)"
        # The change to the table as a patch in the log: the artifact store is
        # not reachable from everywhere the port is worked on, and the log is.
        diff -u ../gamedata/sigsegv/windows.txt windows.txt > windows.patch || true
        if [ $(wc -l < windows.patch) -le 2000 ]; then cat windows.patch; else echo "windows.patch: $(wc -l < windows.patch) lines, in the artifact"; fi
        tail -n 8 matchvtables.log matchfuncs.log; cat argsize.log
        # String matches a vtable pair contradicts, among the symbols the table uses.
        grep -o 'sym   "[^"]*"' ../gamedata/sigsegv/windows.txt | cut -d'"' -f2 | sort -u > used.txt
        grep '  string vs vtable: ' matchfuncs.log | while read -r _ _ _ _ sym s v; do
          grep -qx "$sym" used.txt && echo "table uses a string match the vtable contradicts: $sym string $s vtable $v"
        done || true
        # Against the build it was made for, the committed table is what the
        # scripts make: an address added by hand without its override, or an
        # override the table lacks, fails here. Against another build the
        # difference is the point, and the derived table is the artifact.
        # A carrying run is making the table anew, so it is allowed to differ.
        if [ -z "${{ steps.state.outputs.previous }}" ] && grep -q "ServerVersion $ver" ../gamedata/sigsegv/windows.txt && ! diff committed.tsv derived.tsv > differ.txt; then
          echo "windows.txt is not what the scripts derive from ServerVersion $ver: $(grep -c '^<' differ.txt) entries only committed, $(grep -c '^>' differ.txt) only derived"
          exit 1
        fi
    - name: Candidates for the functions in wanted.txt
      if: always()
      run: |
        wanted=$(grep -v '^#' tools/winport/wanted.txt | tr '\n' ' ')
        [ -n "$wanted" ] || exit 0
        for sym in $wanted; do
          python3 -c "import json,sys; m=json.load(open('derived/matches.json')).get(sys.argv[1]); print(sys.argv[1], 'turned away:' if m else 'no match', m or '')" "$sym"
        done
        python3 tools/winport/candidates.py game-linux/tf/bin/server_srv.so game-windows/tf/bin/server.dll derived/matches.json $wanted
    # engine.dll has no symbols either and publishes three exports, so its
    # functions are found the way server.dll's are: the Linux engine_srv.so
    # keeps its symbol table, matchfuncs.py pairs the two, candidates.py ranks
    # what is left. The pairing takes minutes, so it runs only when
    # wantedengine.txt names something.
    - name: Candidates for the engine functions in wantedengine.txt
      if: always()
      run: |
        wanted=$(grep -v '^#' tools/winport/wantedengine.txt | tr '\n' ' ')
        [ -n "$wanted" ] || exit 0
        python3 tools/winport/matchfuncs.py game-linux/bin/engine_srv.so game-windows/bin/engine.dll derived/engine-matches.json > derived/engine-matchfuncs.log
        tail -n 3 derived/engine-matchfuncs.log
        for sym in $wanted; do
          python3 -c "import json,sys; m=json.load(open('derived/engine-matches.json')).get(sys.argv[1]); print(sys.argv[1], 'matched:' if m else 'no match', m and {k: (hex(v) if k == 'rva' else v) for k, v in m.items()} or '')" "$sym"
        done
        python3 tools/winport/candidates.py game-linux/bin/engine_srv.so game-windows/bin/engine.dll derived/engine-matches.json $wanted
    - name: Windows signatures for the plugin's functions in pluginsigs.txt
      if: always()
      run: |
        python3 - <<'PY' > derived/pluginsigs.json
        import json
        matches = json.load(open("derived/matches.json"))
        rows = []
        for line in open("tools/winport/pluginsigs.txt"):
            if line.strip() and not line.startswith("#"):
                name, sym, *slot = line.split()
                m = matches.get(sym)
                if not m and slot:
                    # Class+0xOFF: the Windows primary vtable slot, read off
                    # this build's dump so an update moves it with the table.
                    cls, off = slot[0].split("+")
                    for row in open(f"derived/win-vtables/{cls}.txt"):
                        if row.startswith("// vtable") and "offset 0x0000" not in row:
                            break
                        if row.startswith(f"+{int(off, 16):#06x}:"):
                            m = {"rva": int(row.split()[1], 16) - 0x10000000, "via": "vtable slot " + slot[0]}
                print(name, sym, m and {k: m[k] for k in ("rva", "via") if k in m}, file=__import__("sys").stderr)
                if m:
                    rows.append({"name": name, "sym": sym, "rva": m["rva"]})
        print(json.dumps(rows))
        PY
        python3 tools/winport/winsig.py game-windows/tf/bin/server.dll derived/pluginsigs.json
    - name: The questions in inspect.sh
      if: always()
      run: bash tools/winport/bed/inspect.sh
    # The same queries the heapcheck job runs, last so the end of the log holds them; minutes after a push rather
    # than after a Windows server has been installed.
    - name: Disassemble the queries in disasm.txt
      if: always()
      run: python3 tools/winport/bed/disasm.py game-windows tools/winport/bed/disasm.txt
    # The artifact store is not reachable from everywhere the port is worked
    # on, and the branch is. Only a carried run commits: without `previous` the
    # overrides still hold for the old build and the table would leave them out.
    # The `commit` input pushes to the ref the job ran on; an update found by
    # itself goes to winport-auto-<build>, made from that ref, and never to it.
    # The push starts no run of this job (a push with the job's token starts no
    # workflow), and if it did, table.json would then match and change nothing.
    - name: Commit the table for the build served now
      if: steps.state.outputs.target != '' && steps.state.outputs.previous != ''
      run: |
        [ -n "$MANIFEST" ] || { echo "no depot 232255 manifest in the download log, so table.json cannot record this build"; exit 1; }
        cp derived/windows.txt gamedata/sigsegv/windows.txt
        python3 -c "import json,sys; open('tools/winport/table.json','w').write(json.dumps({'build': sys.argv[1], 'manifest': sys.argv[2]}, indent=1) + '\\n')" "$VER" "$MANIFEST"
        # The three have to agree before the branch exists, not after a bed
        # run on it says nothing loaded.
        python3 tools/winport/checktable.py
        git config user.name github-actions
        git config user.email github-actions@users.noreply.github.com
        git add gamedata/sigsegv/windows.txt tools/winport/overrides.json tools/winport/table.json
        git commit -m "gamedata(windows): addresses for ServerVersion $VER" -m "carried from $PREVIOUS by the Address table job, run ${{ github.run_id }}"
        git push origin "HEAD:refs/heads/$TARGET"
      env:
        VER: ${{ steps.state.outputs.ver }}
        MANIFEST: ${{ steps.state.outputs.manifest }}
        PREVIOUS: ${{ steps.state.outputs.previous }}
        TARGET: ${{ steps.state.outputs.target }}
    - name: Play the carried table on the bed
      if: startsWith(steps.state.outputs.target, 'winport-auto-') && steps.state.outputs.previous != ''
      run: gh workflow run windows.yml -R "$GITHUB_REPOSITORY" --ref "$TARGET"
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET: ${{ steps.state.outputs.target }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: derived-addrs
        path: derived

name: Address table

# windows.txt from the game build Steam serves now, by the same scripts that
# made the committed one, and how the two differ. Every entry is a fixed RVA
# keyed to a ServerVersion, so a Valve update turns them all off until this
# runs. The result is an artifact; committing it is a person's call.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches:
      - 'sigmod-windows-bed'
    paths:
      - '.github/workflows/addrs.yml'
      - 'tools/winport/*.py'
      - 'tools/winport/overrides.json'
      - 'gamedata/sigsegv/windows.txt'
      - 'tools/winport/wanted.txt'
      - 'tools/winport/pluginsigs.txt'
      - 'tools/winport/bed/disasm.*'
      - 'tools/winport/bed/inspect.sh'

concurrency:
  group: addrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addrs:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Tools
      run: |
        pip install --quiet capstone pefile pyelftools
        sudo apt-get install -y -q binutils > /dev/null
        curl -sSfL --retry 3 -o dd.zip https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-linux-x64.zip
        unzip -q dd.zip -d dd && chmod +x dd/DepotDownloader
    - name: The two server binaries of the current build
      run: |
        printf 'regex:^tf/bin/server(_srv)?\\.(so|dll)$\nbin/engine.dll\ntf/steam.inf\n' > files.txt
        for os in linux windows; do
          for attempt in 1 2 3; do
            ./dd/DepotDownloader -app 232250 -os $os -filelist files.txt -dir game-$os && break
            sleep 15
          done
        done
        ls -la game-*/tf/bin game-*/tf/steam.inf
        grep -h -i 'ServerVersion' game-*/tf/steam.inf
    - name: Derive the table
      run: |
        ver=$(grep -i '^ServerVersion=' game-windows/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        linux_ver=$(grep -i '^ServerVersion=' game-linux/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        [ "$ver" = "$linux_ver" ] || { echo "the two builds differ: $ver vs $linux_ver"; exit 1; }
        mkdir -p derived /tmp/sigport && cd derived
        python3 ../tools/winport/classify.py .. > classify.log && cp /tmp/sigport/classified.json .
        python3 ../tools/winport/dumplinuxvtables.py ../game-linux/tf/bin/server_srv.so linux-vtables > dumplinux.log
        python3 ../tools/winport/dumpvtables.py ../game-windows/tf/bin/server.dll win-vtables > dumpwin.log
        python3 ../tools/winport/matchvtables.py linux-vtables win-vtables classified.json > matchvtables.log
        python3 ../tools/winport/matchfuncs.py ../game-linux/tf/bin/server_srv.so ../game-windows/tf/bin/server.dll matches.json linux-vtables win-vtables > matchfuncs.log
        python3 ../tools/winport/argsize.py ../game-windows/tf/bin/server.dll matches.json > argsize.log
        python3 ../tools/winport/datamaps.py ../game-windows/tf/bin/server.dll ../gamedata/sigsegv/datamaps.txt > datamaps.json
        python3 ../tools/winport/emitgamedata.py matches.json "$ver" datamaps.json ../tools/winport/knownvtidx.generated.txt > windows.txt
    - name: How it differs from the committed table
      if: always()
      run: |
        cd derived
        ver=$(grep -i '^ServerVersion=' ../game-windows/tf/steam.inf | cut -d= -f2 | tr -d '\r')
        echo "build served now: ServerVersion $ver"
        echo "committed table:  $(grep -m1 -o 'ServerVersion [0-9]*' ../gamedata/sigsegv/windows.txt)"
        addrs() { awk '/^\t+"[^"]+"\r?$/ { name = $0 } /^\t+addr +"/ { print name "\t" $2 }' "$1" | sort; }
        addrs ../gamedata/sigsegv/windows.txt > committed.tsv
        addrs windows.txt > derived.tsv
        echo "entries: committed $(wc -l < committed.tsv), derived $(wc -l < derived.tsv), same address $(comm -12 committed.tsv derived.tsv | wc -l)"
        # The change to the table as a patch in the log: the artifact store is
        # not reachable from everywhere the port is worked on, and the log is.
        diff -u ../gamedata/sigsegv/windows.txt windows.txt > windows.patch || true
        if [ $(wc -l < windows.patch) -le 2000 ]; then cat windows.patch; else echo "windows.patch: $(wc -l < windows.patch) lines, in the artifact"; fi
        tail -n 8 matchvtables.log matchfuncs.log; cat argsize.log
        # Against the build it was made for, the committed table is what the
        # scripts make: an address added by hand without its override, or an
        # override the table lacks, fails here. Against another build the
        # difference is the point, and the derived table is the artifact.
        if grep -q "ServerVersion $ver" ../gamedata/sigsegv/windows.txt && ! diff committed.tsv derived.tsv > differ.txt; then
          echo "windows.txt is not what the scripts derive from ServerVersion $ver: $(grep -c '^<' differ.txt) entries only committed, $(grep -c '^>' differ.txt) only derived"
          exit 1
        fi
    - name: Candidates for the functions in wanted.txt
      if: always()
      run: |
        wanted=$(grep -v '^#' tools/winport/wanted.txt | tr '\n' ' ')
        [ -n "$wanted" ] || exit 0
        for sym in $wanted; do
          python3 -c "import json,sys; m=json.load(open('derived/matches.json')).get(sys.argv[1]); print(sys.argv[1], 'turned away:' if m else 'no match', m or '')" "$sym"
        done
        python3 tools/winport/candidates.py game-linux/tf/bin/server_srv.so game-windows/tf/bin/server.dll derived/matches.json $wanted
    - name: Windows signatures for the plugin's functions in pluginsigs.txt
      if: always()
      run: |
        python3 - <<'PY' > derived/pluginsigs.json
        import json
        matches = json.load(open("derived/matches.json"))
        rows = []
        for line in open("tools/winport/pluginsigs.txt"):
            if line.strip() and not line.startswith("#"):
                name, sym = line.split()
                m = matches.get(sym)
                print(name, sym, m and {k: m[k] for k in ("rva", "via") if k in m}, file=__import__("sys").stderr)
                if m:
                    rows.append({"name": name, "sym": sym, "rva": m["rva"]})
        print(json.dumps(rows))
        PY
        python3 tools/winport/winsig.py game-windows/tf/bin/server.dll derived/pluginsigs.json
    - name: The questions in inspect.sh
      if: always()
      run: sh tools/winport/bed/inspect.sh
    # The same queries the heapcheck job runs, last so the end of the log holds them; minutes after a push rather
    # than after a Windows server has been installed.
    - name: Disassemble the queries in disasm.txt
      if: always()
      run: python3 tools/winport/bed/disasm.py game-windows tools/winport/bed/disasm.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: derived-addrs
        path: derived

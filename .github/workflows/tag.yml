# Tags a commit of main from the Actions page, for a session that cannot push
# tags itself. A tag pushed with GITHUB_TOKEN starts no workflow, so the
# release build is then run by hand on the tag: windows.yml, ref = the tag.
name: Tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to create, a date for a release (20260930)
        required: true
      ref:
        description: the commit to tag
        default: main
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - run: |
        git tag "${{ inputs.tag }}"
        git push origin "refs/tags/${{ inputs.tag }}"
